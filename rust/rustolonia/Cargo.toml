[package]
name = "rustolonia"
version = "12.1.8"
edition = "2021"
license = "MIT"
description = "Idiomatic Rust API for Avalonia"
repository = "https://github.com/Devolutions/rustolonia"
readme = "README.md"
rust-version = "1.88"
keywords = ["avalonia", "gui", "ui", "desktop", "xaml"]
categories = ["gui", "api-bindings"]
include = ["/src/**", "/README.md", "/LICENSE"]

[[bin]]
name = "native_host_shutdown"
path = "src/native_host_shutdown.rs"

[[bin]]
name = "native_popup_host"
path = "src/native_popup_host.rs"

[[bin]]
name = "native_application_name"
path = "src/native_application_name.rs"

[[bin]]
name = "native_macos_background"
path = "src/native_macos_background.rs"

[[bin]]
name = "native_menu_host"
path = "src/native_menu_host.rs"

[features]
default = ["dev-host-path"]
# See rustolonia-sys: never download the prebuilt host at build time.
no-download = ["rustolonia-sys/no-download"]
# See rustolonia-sys: remember the staged host directory as a runtime fallback.
dev-host-path = ["rustolonia-sys/dev-host-path"]
# Direct DRM/KMS display instead of X11 (Linux GNU targets only).
linux-drm = ["rustolonia-sys/linux-drm"]
# See rustolonia-sys: link the host statically instead of loading it.
static-host = ["rustolonia-sys/static-host"]

[dependencies]
rustolonia-macros = { version = "=12.1.8", path = "../rustolonia-macros" }
rustolonia-sys = { version = "=12.1.8", path = "../rustolonia-sys", default-features = false }
chrono = { version = "0.4", default-features = false, optional = true }
time = { version = "0.3", default-features = false, optional = true }
rust_decimal = { version = "1", default-features = false, optional = true }
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }

[dev-dependencies]
avalonia-sample = { path = "../avalonia-sample" }

[package.metadata.docs.rs]
features = ["no-download"]
no-default-features = true
