[package]
name = "rustolonia-apk"
version = "12.1.8"
edition = "2021"
license = "MIT"
description = "Build code-first Rustolonia apps into Android APKs with Cargo alone, from the prebuilt host APK"
repository = "https://github.com/Devolutions/rustolonia"
rust-version = "1.88"
keywords = ["avalonia", "android", "apk", "gui"]
categories = ["development-tools::build-utils"]

[[bin]]
name = "cargo-rustolonia-apk"
path = "src/main.rs"

[dependencies]
dirs = "6"
flate2 = "1"
ring = "0.17"
serde_json = "1"
sha2 = "0.10"
# Same client and features as rustolonia-sys's host download.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
