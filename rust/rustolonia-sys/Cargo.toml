[package]
name = "rustolonia-sys"
version = "12.1.7"
edition = "2021"
license = "MIT"
description = "Raw nano-COM bindings for the Avalonia NativeAOT host"
repository = "https://github.com/Devolutions/rustolonia"
readme = "README.md"
rust-version = "1.88"
keywords = ["avalonia", "gui", "ffi", "nativeaot", "sys"]
categories = ["external-ffi-bindings", "gui"]
build = "build.rs"
include = [
    "/build.rs",
    "/build_support/**",
    "/host-checksums.txt",
    "/include/**",
    "/src/**",
    "/README.md",
    "/LICENSE",
]
links = "rustolonia_host"

[features]
default = ["dev-host-path"]
# Never download the prebuilt host; the application provides it at run time.
no-download = []
# Bake the staged host directory into the binary as a last-resort runtime
# search path, so `cargo run` and `cargo test` work without setup.
dev-host-path = []
# Download the direct-display Linux host instead of the desktop X11 host.
linux-drm = []
# Link the prebuilt host into the executable as a static library instead of
# loading rustolonia_host.dll/.so/.dylib at run time (desktop targets only).
# The desktop host and its project-native graphics dependencies are linked in.
# Operating-system libraries and frameworks can still be dynamic.
static-host = []

# Browser builds (wasm32-unknown-emscripten) link the host statically into
# the .NET WebAssembly app instead of loading a shared library.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
libloading = "0.8"

[build-dependencies]
dirs = "6"
flate2 = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
ureq = { version = "2.12", default-features = false, features = ["tls"] }

# build_support/host.rs is also compiled into the unit tests.
[dev-dependencies]
flate2 = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[package.metadata.docs.rs]
# docs.rs builds never download the host (build.rs also checks DOCS_RS).
features = ["no-download"]
no-default-features = true
