[package]
name = "rustolonia-axaml-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Standalone Rust application using the Rust-only AXAML compiler"
build = "build.rs"

[dependencies]
# The v12.1.5 tag predates this template's APIs. Until a release includes them,
# override the three Rustolonia crates with this revision via .cargo/config.toml.
rustolonia = { git = "https://github.com/Devolutions/rustolonia", tag = "v12.1.5" }

[build-dependencies]
rustolonia-bindgen = { git = "https://github.com/Devolutions/rustolonia", tag = "v12.1.5" }

[workspace]
