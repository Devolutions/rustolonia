[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Jiffshot uses Rustolonia's release and its prebuilt host. The repository's
# own .cargo/config.toml turns host downloads off for everything else in this
# checkout; this turns them back on here (outside the repository it changes
# nothing).
[env]
RUSTOLONIA_NO_DOWNLOAD = "0"
