[package]
name = "neohtop-avalonia"
version = "1.2.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "NeoHtop NativeAOT Avalonia desktop application."
license = "MIT"

[dependencies]
avalonia = { path = "../../../rust/avalonia" }
regex = "1"
sysinfo = { version = "0.35.2", features = ["disk", "multithread", "network", "system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"

[workspace]
