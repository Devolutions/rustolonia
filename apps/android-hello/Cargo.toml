[package]
name = "android-hello"
version = "0.1.0"
edition = "2021"
publish = false
description = "A code-first Rustolonia app that runs on Android and the desktop from one UI module"

# The cdylib is what the APK packages (libandroid_hello.so); the rlib lets
# the desktop binary in src/main.rs reuse the same `ui` module.
[lib]
name = "android_hello"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "android-hello"
path = "src/main.rs"

[dependencies]
rustolonia = { path = "../../rust/rustolonia" }

# Read by `cargo rustolonia-apk`, which packages the library into the
# prebuilt host APK without any .NET tooling. (android/ is the alternative
# for apps that need their own C#; it uses net.devolutions.rustolonia.androidhello.)
[package.metadata.rustolonia.android]
package = "net.devolutions.rustolonia.samples.hello"
label = "Rustolonia Hello"
version-code = 1

[workspace]
