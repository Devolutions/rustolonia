[package]
name = "archive-tool"
version = "0.1.0"
edition = "2021"
publish = false
description = "A NanaZip-like dual-pane archive manager"

[dependencies]
avalonia = { path = "../../rust/avalonia" }
bzip2 = "0.5"
cab = "0.6"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "frame"] }
sevenz-rust2 = { version = "0.19", default-features = false, features = ["compress", "util"] }
tar = "0.4"
xz2 = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = { version = "0.13", default-features = false }

[workspace]
