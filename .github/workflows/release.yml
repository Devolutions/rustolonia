name: Release

# Release procedure (see rust/PRODUCTIZATION.md#releasing):
#   Prepare and merge the version, then dispatch phase=all from master:
#     build -> stage tarballs and SHA256SUMS as Actions artifacts.
#     pin-release -> commit host checksums on master, tag vX.Y.Z on it.
#     publish -> verify a standalone git consumer, create release vX.Y.Z.
#                Non-draft by default; draft=true stages a draft instead.
#                Optionally publish crates after approval in `crates-io`.
#   The manual fallback splits this into phase=build, a local checksum
#   commit and tag push, then phase=publish with build_run_id.

on:
  workflow_dispatch:
    inputs:
      phase:
        description: all builds, pins checksums on master, tags and publishes; build and publish are the manual two-dispatch path
        default: all
        required: true
        type: choice
        options:
          - all
          - build
          - publish
      version:
        description: Release version (without v); must match the checked-in versions
        default: '12.1.4'
        required: true
        type: string
      publish_crates:
        description: Also publish to crates.io (requires trusted publishing and environment approval)
        default: false
        type: boolean
      build_run_id:
        description: Publish phase only; successful build-phase run ID whose artifacts and source must match the final tag
        default: ''
        type: string
      draft:
        description: Create a draft GitHub release instead of publishing immediately
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  version:
    name: check version
    if: inputs.phase == 'build' || inputs.phase == 'all'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Check release version and dispatch
        shell: pwsh
        run: |
          . ./rust/package-shared.ps1
          $version = Get-RustoloniaReleaseVersion -RustoloniaRoot $PWD
          if ($env:GITHUB_REF -ne 'refs/heads/master') { throw 'Dispatch the host build from master after merging the release preparation.' }
          if ($env:REQUESTED_VERSION -ne $version) { throw "Requested version $env:REQUESTED_VERSION does not match version $version." }
          if ($env:PHASE -eq 'build' -and $env:PUBLISH_CRATES -eq 'true') { throw 'publish_crates is only valid for the publish and all phases.' }
          if ($env:PHASE -eq 'all') {
            if ($env:BUILD_RUN_ID) { throw 'build_run_id is only used by the publish phase; phase=all builds its own hosts.' }
            if ($env:DRAFT -eq 'true' -and $env:PUBLISH_CRATES -eq 'true') { throw 'Cannot publish crates for a draft release.' }
          }
          if (@(git tag --list "v$version").Count -gt 0) { throw "Final tag v$version already exists; use the publish phase for its staged build." }
          if ((Get-Content build/SharedVersion.props -Raw) -notmatch "<Version>$([regex]::Escape($version))</Version>") {
            throw "build/SharedVersion.props does not match version $version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PHASE: ${{ inputs.phase }}
          PUBLISH_CRATES: ${{ inputs.publish_crates }}
          DRAFT: ${{ inputs.draft }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}

  build:
    name: host (${{ matrix.rid }})
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      RestoreConfigFile: ${{ github.workspace }}/avalonia-src/NuGet.Config
      VERSION: ${{ needs.version.outputs.version }}
      # Oldest supported macOS; see rust/PLATFORMS.md.
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
          # The oldest runner image sets the glibc floor (2.35).
          - { os: ubuntu-22.04, rid: linux-x64 }
          - { os: ubuntu-22.04-arm, rid: linux-arm64 }
          # Intel macOS runners are slow; Apple silicon cross-builds osx-x64
          # and smoke-launches it through Rosetta 2.
          - { os: macos-14, rid: osx-x64, rust-target: x86_64-apple-darwin }
          - { os: macos-14, rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Apply Avalonia source patches
        shell: pwsh
        run: ./avalonia-patches/apply-avalonia-patches.ps1 -AvaloniaRoot ./avalonia-src

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201

      - name: Repair Rust shims (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$HOME/.cargo/bin"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | bash -s -- -y --default-toolchain none --no-modify-path --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:RUST_TARGET) {
            rustup target add $env:RUST_TARGET
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Rosetta 2 for the x64 smoke test
        if: matrix.rust-target == 'x86_64-apple-darwin'
        run: |
          /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          /usr/bin/arch -x86_64 /usr/bin/true

      - name: Install Linux smoke-test display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Restore producer packages (retries on NuGet flakes)
        shell: pwsh
        run: |
          $project = 'avalonia-src/src/Avalonia.Build.Tasks/Avalonia.Build.Tasks.csproj'
          $delays = @(15, 30, 60, 90, 120)
          $attempt = 0
          while ($true) {
            $attempt++
            dotnet restore $project
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -gt $delays.Length) { throw "restore failed after $attempt attempts: $project" }
            $delay = $delays[$attempt - 1]
            Write-Host "restore of $project failed (attempt $attempt); retrying in ${delay}s"
            Start-Sleep -Seconds $delay
          }

      - name: Build the producer's build tasks
        shell: pwsh
        run: dotnet build avalonia-src/src/Avalonia.Build.Tasks/Avalonia.Build.Tasks.csproj -c Release --no-restore

      - name: Package the host tarball
        shell: pwsh
        env:
          AVALONIA_RUST_SIGN_COMMAND: ${{ vars.AVALONIA_RUST_SIGN_COMMAND }}
        run: ./rust/package-host.ps1 -Rid ${{ matrix.rid }} -OutputRoot rust/artifacts/host

      - name: Build and launch a standalone app against the packaged crates and this tarball
        shell: pwsh
        run: ./rust/tests/test-standalone-app.ps1 -Rid ${{ matrix.rid }} -TarballDirectory rust/artifacts/host -WorkDirectory "$env:RUNNER_TEMP/standalone-app"

      - name: Build and launch a standalone app against the build source
        shell: pwsh
        run: |
          git tag release-test-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./rust/tests/test-standalone-app.ps1 -Rid ${{ matrix.rid }} -TarballDirectory rust/artifacts/host `
            -GitRepository ([Uri]::new("$($PWD.Path)/").AbsoluteUri) -GitTag release-test-source `
            -WorkDirectory (Join-Path $env:RUNNER_TEMP 'git-app')

      - uses: actions/upload-artifact@v4
        with:
          name: rustolonia-host-${{ matrix.rid }}
          path: rust/artifacts/host/*.tar.gz
          if-no-files-found: error

  build-ios:
    name: iOS host (${{ matrix.rid }})
    needs: version
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: iossimulator-arm64, rust-target: aarch64-apple-ios-sim, mode: simulator-arm64 }
          - { rid: iossimulator-x64, rust-target: x86_64-apple-ios, mode: simulator-x64 }
          - { rid: ios-arm64, rust-target: aarch64-apple-ios, mode: device }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Apply Avalonia source patches
        shell: pwsh
        run: ./avalonia-patches/apply-avalonia-patches.ps1 -AvaloniaRoot ./avalonia-src

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403

      - name: Install iOS workloads
        run: dotnet workload install ios maccatalyst tvos --version 10.0.401

      - name: Set up Rust
        # The runner context is unavailable in job-level env.
        env:
          CARGO_HOME: ${{ runner.temp }}/rustolonia-cargo
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | bash -s -- -y --default-toolchain none --no-modify-path --profile minimal
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Install the Rust target
        run: rustup target add ${{ matrix.rust-target }}

      - name: Package the production iOS host
        shell: pwsh
        run: ./rust/package-ios-host.ps1 -Rid ${{ matrix.rid }} -OutputRoot rust/artifacts/host

      - name: Build a standalone Rust app without .NET
        shell: bash
        run: |
          set -euo pipefail
          export RUSTOLONIA_IOS_HOST_ARCHIVE="$GITHUB_WORKSPACE/rust/artifacts/host/rustolonia-host-$VERSION-${{ matrix.rid }}.tar.gz"
          export PATH="$CARGO_HOME/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          if command -v dotnet; then
            echo "The Rust-only consumer check must not have dotnet on PATH." >&2
            exit 1
          fi
          ./rust/tests/test-ios-standalone.sh "$RUSTOLONIA_IOS_HOST_ARCHIVE" '${{ matrix.mode }}'

      - uses: actions/upload-artifact@v4
        with:
          name: rustolonia-host-${{ matrix.rid }}
          path: rust/artifacts/host/*.tar.gz
          if-no-files-found: error

  build-android:
    name: Android host
    needs: version
    runs-on: ubuntu-22.04
    env:
      RestoreConfigFile: ${{ github.workspace }}/avalonia-src/NuGet.Config
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Apply Avalonia source patches
        shell: pwsh
        run: ./avalonia-patches/apply-avalonia-patches.ps1 -AvaloniaRoot ./avalonia-src

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install the Android workload and SDK platform
        run: |
          set -euo pipefail
          dotnet workload install android --version 10.0.401
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add aarch64-linux-android x86_64-linux-android
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package the Android host APK
        shell: pwsh
        run: ./rust/package-android-host.ps1 -OutputRoot rust/artifacts/host

      # Exercises the consumer path end to end: cargo-rustolonia-apk resolves
      # the app's rustolonia-sys, "downloads" the host from a file:// mirror
      # laid out like the release, verifies it against a checksum list and
      # packages android-hello. A dotnet shim that always fails proves that
      # nothing on the consumer side runs .NET.
      - name: Build a Cargo-only Android app without .NET
        run: |
          set -euo pipefail
          asset="rustolonia-host-$VERSION-android.apk"
          cargo build --locked --release --manifest-path rust/Cargo.toml -p rustolonia-apk
          mirror="$RUNNER_TEMP/android-mirror"
          mkdir -p "$mirror/v$VERSION" "$RUNNER_TEMP/no-dotnet"
          cp "rust/artifacts/host/$asset" "$mirror/v$VERSION/"
          printf '#!/bin/sh\necho "dotnet must not run in a Cargo-only Android build" >&2\nexit 1\n' \
            > "$RUNNER_TEMP/no-dotnet/dotnet"
          chmod +x "$RUNNER_TEMP/no-dotnet/dotnet"
          export PATH="$RUNNER_TEMP/no-dotnet:$PATH"
          unset DOTNET_ROOT
          export RUSTOLONIA_HOST_BASE_URL="file://$mirror"
          export RUSTOLONIA_HOST_CHECKSUMS="rust/artifacts/host/$asset.sha256"
          export RUSTOLONIA_CACHE_DIR="$RUNNER_TEMP/rustolonia-cache"
          out="$RUNNER_TEMP/android-hello.apk"
          ./rust/target/release/cargo-rustolonia-apk --manifest-path apps/android-hello/Cargo.toml --out "$out"
          test -f "$RUSTOLONIA_CACHE_DIR/$VERSION/android/$asset"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -c -P 16 4 "$out"
          "$tools/apksigner" verify --min-sdk-version 24 --verbose "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: rustolonia-host-android
          path: rust/artifacts/host/*.apk
          if-no-files-found: error

  build-browser:
    name: browser host
    needs: version
    runs-on: ubuntu-22.04
    env:
      RestoreConfigFile: ${{ github.workspace }}/avalonia-src/NuGet.Config
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Apply Avalonia source patches
        shell: pwsh
        run: ./avalonia-patches/apply-avalonia-patches.ps1 -AvaloniaRoot ./avalonia-src

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403

      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools --version 10.0.401

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add wasm32-unknown-emscripten
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package the browser host
        shell: pwsh
        run: ./rust/package-browser-host.ps1 -OutputRoot rust/artifacts/host

      # The consumer path: the upstream Emscripten SDK at the version the
      # host records, Cargo, and the packaged host. A dotnet shim that always
      # fails proves that nothing on the consumer side runs .NET.
      - name: Install the Emscripten SDK the host records
        run: |
          set -euo pipefail
          archive="rust/artifacts/host/rustolonia-host-$VERSION-browser-wasm.tar.gz"
          emscripten=$(tar -xzOf "$archive" host-manifest.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["emscriptenVersion"])')
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$emscripten"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$emscripten"

      - name: Build and load a Cargo-only browser app without .NET
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/rust/artifacts/host/rustolonia-host-$VERSION-browser-wasm.tar.gz"
          mkdir -p "$RUNNER_TEMP/no-dotnet"
          printf '#!/bin/sh\necho "dotnet must not run in a Cargo-only browser build" >&2\nexit 1\n' \
            > "$RUNNER_TEMP/no-dotnet/dotnet"
          chmod +x "$RUNNER_TEMP/no-dotnet/dotnet"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          export PATH="$RUNNER_TEMP/no-dotnet:$PATH"
          unset DOTNET_ROOT
          export RUSTOLONIA_BROWSER_HOST_ARCHIVE="$archive"
          export RUSTOLONIA_BROWSER_HOST_SHA256="$(cut -d ' ' -f 1 "$archive.sha256")"
          site="$RUNNER_TEMP/browser-site"
          python3 samples/browser-standalone/build.py --out "$site"
          python3 samples/browser-standalone/smoke-test.py "$site"

      - uses: actions/upload-artifact@v4
        with:
          name: rustolonia-host-browser-wasm
          path: rust/artifacts/host/*.tar.gz
          if-no-files-found: error

  stage-release:
    name: stage release artifacts
    needs: [version, build, build-ios, build-android, build-browser]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rustolonia-host-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum *.tar.gz *.apk > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rustolonia-release-${{ needs.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  # phase=all: commit the staged hashes on the build source and tag it, as the
  # manual path does locally. The push is atomic and never forced, so it fails
  # without changing anything if master moved or the tag appeared meanwhile.
  pin-release:
    name: pin checksums and tag v${{ needs.version.outputs.version }}
    needs: [version, stage-release]
    if: inputs.phase == 'all'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: rustolonia-release-${{ needs.version.outputs.version }}
          path: ${{ runner.temp }}/release/v${{ needs.version.outputs.version }}

      - name: Verify staged asset hashes
        working-directory: ${{ runner.temp }}/release/v${{ needs.version.outputs.version }}
        run: sha256sum --check --strict SHA256SUMS

      - name: Check that master is still the build source and the tag is free
        shell: pwsh
        run: |
          $master = gh api "repos/$env:GH_REPO/git/ref/heads/master" --jq .object.sha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($master -ne $env:GITHUB_SHA) { throw "master moved from the build source $env:GITHUB_SHA to $master; dispatch a new release run." }
          $tags = @(gh api "repos/$env:GH_REPO/git/matching-refs/tags/v$env:VERSION" --jq '.[].ref')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tags -contains "refs/tags/v$env:VERSION") { throw "Tag v$env:VERSION already exists; use the publish phase." }

      - id: pin
        name: Commit host checksums and tag
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ./rust/prepare-release.ps1 -Checksums -CommitAndTag -SourceRevision $env:GITHUB_SHA `
            -SumsFile (Join-Path $env:RUNNER_TEMP 'release' "v$env:VERSION" 'SHA256SUMS')
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      # RELEASE_PUSH_TOKEN is only needed if rules on master or v* tags block
      # GITHUB_TOKEN; see rust/PRODUCTIZATION.md#releasing.
      - name: Push master and the tag
        env:
          PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --atomic "https://github.com/$GH_REPO.git" HEAD:refs/heads/master "refs/tags/v$VERSION"

  publish:
    name: publish ${{ inputs.version }}
    needs: pin-release
    # The publish phase runs alone; phase=all continues once pin-release pushed the tag.
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' &&
      (inputs.phase == 'publish' || (inputs.phase == 'all' && needs.pin-release.result == 'success'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PHASE: ${{ inputs.phase }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      PINNED_COMMIT: ${{ needs.pin-release.outputs.commit }}
      DRAFT: ${{ inputs.draft }}
      PUBLISH_CRATES: ${{ inputs.publish_crates }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Linux smoke-test display
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Validate the staged build
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/master') { throw 'Dispatch publication from master.' }
          if ($env:DRAFT -eq 'true' -and $env:PUBLISH_CRATES -eq 'true') { throw 'Cannot publish crates for a draft release.' }
          if ($env:PHASE -eq 'all') {
            # This run built the hosts from GITHUB_SHA and pushed the tag itself.
            $sourceSha = $env:GITHUB_SHA
            if ((git rev-parse HEAD) -ne $env:PINNED_COMMIT) { throw "v$env:VERSION does not point at the checksum commit $env:PINNED_COMMIT pushed by this run." }
          }
          else {
            if ($env:BUILD_RUN_ID -notmatch '^[1-9][0-9]*$') { throw 'Pass the successful build-phase build_run_id.' }
            $runJson = gh api "repos/$env:GH_REPO/actions/runs/$env:BUILD_RUN_ID"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $run = $runJson | ConvertFrom-Json
            if ($run.conclusion -ne 'success' -or $run.event -ne 'workflow_dispatch' -or
                $run.head_branch -ne 'master' -or $run.path -ne '.github/workflows/release.yml') {
              throw 'The build must be a successful Release dispatch from master.'
            }
            $sourceSha = $run.head_sha
          }
          git merge-base --is-ancestor $sourceSha HEAD
          if ($LASTEXITCODE -ne 0) { throw 'The consumer tag must descend from the build source.' }
          $changed = @(git diff --name-only $sourceSha HEAD |
            Where-Object { $_ -ne 'rust/rustolonia-sys/host-checksums.txt' })
          if ($LASTEXITCODE -ne 0) { throw 'Could not compare the build source and consumer tag.' }
          if ($changed.Count -gt 0) { throw "Sources changed since the build: $($changed -join ', ')" }

      # Without a token, download-artifact reads this run's own artifacts (phase=all).
      - uses: actions/download-artifact@v4
        with:
          name: rustolonia-release-${{ inputs.version }}
          path: ${{ runner.temp }}/release/v${{ inputs.version }}
          run-id: ${{ inputs.phase == 'publish' && inputs.build_run_id || github.run_id }}
          github-token: ${{ inputs.phase == 'publish' && github.token || '' }}

      - name: Verify staged asset hashes
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP 'release' "v$env:VERSION"
          Push-Location $release
          sha256sum --check --strict SHA256SUMS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Verify the version and committed host checksums
        shell: pwsh
        run: |
          . ./rust/package-shared.ps1
          $version = Get-RustoloniaReleaseVersion -RustoloniaRoot $PWD
          if ($version -ne $env:VERSION) { throw "The checkout is at version $version, not $env:VERSION." }
          ./rust/prepare-release.ps1 -Checksums -SumsFile (Join-Path $env:RUNNER_TEMP 'release' "v$env:VERSION" 'SHA256SUMS')
          git diff --exit-code -- rust/rustolonia-sys/host-checksums.txt
          if ($LASTEXITCODE -ne 0) { throw 'host-checksums.txt does not match the build; run rust/prepare-release.ps1 -Checksums -SumsFile <SHA256SUMS> and commit before tagging.' }

      - name: Build and launch a fresh app against the final git tag
        shell: pwsh
        run: |
          ./rust/tests/test-standalone-app.ps1 -Rid linux-x64 `
            -TarballDirectory (Join-Path $env:RUNNER_TEMP 'release' "v$env:VERSION") `
            -GitRepository ([Uri]::new("$($PWD.Path)/").AbsoluteUri) -GitTag "v$env:VERSION" `
            -UseCommittedChecksums -Distributable `
            -WorkDirectory (Join-Path $env:RUNNER_TEMP 'git-consumer')

      - name: Publish the GitHub release
        working-directory: ${{ runner.temp }}/release/v${{ inputs.version }}
        run: |
          set -euo pipefail
          releases=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name')
          if grep -Fxq "v$VERSION" <<< "$releases"; then
            echo "Release v$VERSION already exists; do not overwrite its assets." >&2
            exit 1
          fi
          flags=(--verify-tag --title "rustolonia $VERSION" --notes "Prebuilt rustolonia hosts for rustolonia-sys $VERSION.")
          if [ "$DRAFT" = 'true' ]; then flags+=(--draft); fi
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" "${flags[@]}" ./*.tar.gz ./*.apk SHA256SUMS

  publish-crates:
    name: publish crates ${{ inputs.version }}
    needs: publish
    if: >-
      !cancelled() && needs.publish.result == 'success' && github.event_name == 'workflow_dispatch' &&
      (inputs.phase == 'publish' || inputs.phase == 'all') && inputs.publish_crates && !inputs.draft
    runs-on: ubuntu-22.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package the crates
        working-directory: rust
        run: cargo package --locked -p rustolonia-sys -p rustolonia-bindgen -p rustolonia

      # Verified Marketplace publisher; also used by IronRDP and picky-rs.
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth

      - name: Publish the crates
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --locked -p rustolonia-sys -p rustolonia-bindgen -p rustolonia
