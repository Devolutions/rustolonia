name: Retry interrupted browser host

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [master]

permissions: {}

concurrency:
  group: retry-browser-host-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      # workflow_run uses the default branch's trusted SHA, not the triggering
      # run's potentially different checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Retry a confirmed runner shutdown
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/retry-interrupted-browser.py
